<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }

        div.container {
            background-color: rgb(0, 0, 0);
            display: flex;
            width: 80%;
            height: 50px;
            border-radius: 20px;
            margin: auto;
            position: relative;
            margin-top: 50vh;

        }

        button {
            background-color: rgb(113, 113, 113);
            border: 1px solid black;
            
            margin: auto;
            border-radius: 100%;
            width: 40px;
            height: 40px;

            flex:none
        }



    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button class="item1" ></button>
        <button class="item2"></button>
        <button class="item3"></button>
        <button class="item4"></button>
        <button class="item5"></button>
        <button class="item6"></button>
        <button class="item7"></button>>
    </div>
</body>
</html>
