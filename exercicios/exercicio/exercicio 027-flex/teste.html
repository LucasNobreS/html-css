<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>

        div.container {
            background-color: rgb(0, 0, 0);
            display: flex;
            width: 80%;
            height: 50px;
            border-radius: 20px;
            margin: auto;
            position: relative;
            margin-top: 50vh;

        }

        .item {
            background-color: rgb(113, 113, 113);
            border: 1px solid black;
            
            margin: auto;
            border-radius: 100%;
            width: 40px;
            height: 40px;

            flex:none
        }

        .item:hover {
            background-color: rgb(255, 255, 255);
            transform: scale(1.5) ;
            transition: all 0.8s ease;
        }

    </style>
</head>
<body>
    <div class="container">
        <button class="item" ></button>
        <button class="item"></button>
        <button class="item"></button>
        <button class="item"></button>
        <button class="item"></button>
        <button class="item"></button>
        <button class="item"></button>>
    </div>
</body>
</html>
